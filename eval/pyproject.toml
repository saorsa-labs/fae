[project]
name = "fae-eval"
version = "0.1.0"
description = "Unified evaluation, benchmarking, and fine-tuning harness for Fae"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
training = [
    "mlx-lm>=0.31.1",
]

[project.scripts]
fae-eval = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
