name: Linux render spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-render-spike.yml"
      - "crates/**"
      - "native/rust/fae-ui-shell/**"
      - "docs/architecture/linux-render-spike-2026-06.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-render-spike.yml"
      - "crates/**"
      - "native/rust/fae-ui-shell/**"
      - "docs/architecture/linux-render-spike-2026-06.md"

concurrency:
  group: linux-render-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-render-and-daemon:
    name: Ubuntu WebKitGTK + ALSA build proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GDK_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          lfs: true

      - name: Install Linux shell and daemon dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libx11-dev \
            libxdo-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libwayland-dev \
            xvfb \
            imagemagick

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Install Zig and cargo-zigbuild
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Check Rust orb shell formatting
        working-directory: native/rust/fae-ui-shell
        run: cargo fmt --all -- --check

      - name: Lint Rust orb shell
        working-directory: native/rust/fae-ui-shell
        run: cargo clippy --all-features --all-targets -- -D warnings -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used

      - name: Build Rust orb shell
        working-directory: native/rust/fae-ui-shell
        run: cargo build --all-features

      - name: Smoke render opaque Settings panel under WebKitGTK/Xvfb
        working-directory: native/rust/fae-ui-shell
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1280x900x24' bash -c '
            ./target/debug/fae-ui-shell --smoke-settings-panel &
            app_pid=$!
            sleep 7
            import -window root "$GITHUB_WORKSPACE/linux-settings-panel.png"
            wait "$app_pid"
          '
          test -s "$GITHUB_WORKSPACE/linux-settings-panel.png"
          file "$GITHUB_WORKSPACE/linux-settings-panel.png"
          colors=$(identify -format '%k' "$GITHUB_WORKSPACE/linux-settings-panel.png")
          echo "settings panel screenshot colors=$colors"
          test "$colors" -ge 8

      - name: Upload Linux Settings panel screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-settings-panel
          path: linux-settings-panel.png
          if-no-files-found: error

      - name: Smoke render orb + pill under Xvfb (P6, per-surface)
        working-directory: native/rust/fae-ui-shell
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1280x900x24' bash -c '
            ./target/debug/fae-ui-shell --smoke-pill &
            app_pid=$!
            sleep 7
            import -window root "$GITHUB_WORKSPACE/linux-orb-pill.png"
            wait "$app_pid"
          '
          test -s "$GITHUB_WORKSPACE/linux-orb-pill.png"
          file "$GITHUB_WORKSPACE/linux-orb-pill.png"
          cd "$GITHUB_WORKSPACE"
          # Per-surface proof (codex): a whole-root color count can pass with only
          # one surface drawn. Crop each window's fixed rect and assert each
          # rendered real pixels. A flat clear yields ~1-2 colors; a rendered orb
          # gradient is dozens+, rendered pill text/accents 8+.
          convert linux-orb-pill.png -crop 420x420+40+40 +repage orb-region.png
          convert linux-orb-pill.png -crop 360x52+500+120 +repage pill-region.png
          orb_colors=$(identify -format '%k' orb-region.png)
          pill_colors=$(identify -format '%k' pill-region.png)
          echo "orb region colors=$orb_colors  pill region colors=$pill_colors"
          test "$orb_colors" -ge 16
          test "$pill_colors" -ge 8

      - name: Upload Linux orb + pill screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-orb-pill
          path: |
            linux-orb-pill.png
            orb-region.png
            pill-region.png
          if-no-files-found: error

      - name: Check daemon workspace formatting
        working-directory: crates
        run: cargo fmt --all -- --check

      - name: Lint fae-daemon production binary with ALSA backend available
        working-directory: crates
        run: cargo clippy -p fae-daemon --bin fae-daemon --all-features -- -D warnings -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used

      - name: Build fae-daemon natively on Ubuntu
        working-directory: crates
        run: cargo build -p fae-daemon --all-features

      - name: P1 deferred proof — zigbuild fae-daemon for Linux x86_64
        working-directory: crates
        run: cargo zigbuild --target x86_64-unknown-linux-gnu -p fae-daemon --all-features

      - name: Verify zigbuilt binary runtime deps (ldd)
        working-directory: crates
        run: |
          set -euo pipefail
          BIN="target/x86_64-unknown-linux-gnu/debug/fae-daemon"
          test -x "$BIN"
          echo "=== ldd $BIN ==="
          ldd "$BIN" | tee /tmp/ldd.txt
          # sherpa-onnx is STATIC-linked, so the ONLY new runtime dep it may add
          # is libstdc++.so.6 (universally present on Linux). Fail if it pulled in
          # onnxruntime/sherpa shared libs (static mode broke) or anything else.
          if grep -Ei 'lib(onnxruntime|sherpa|kaldi|openfst)' /tmp/ldd.txt; then
            echo "ERROR: sherpa-onnx introduced shared runtime deps — expected static linking" >&2
            exit 1
          fi
          echo "runtime deps OK: libstdc++.so.6 (the only C++ dep) is universally present on Linux"
