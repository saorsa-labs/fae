name: Release (Linux)

# Linux release path for the Fae brain: the Rust daemon + orb-host + the
# integrity-gated llama.cpp runtime, packaged as a GPG-signed .deb and an
# AppImage, per arch (x86_64 + aarch64). The macOS app is built by release.yml;
# off-Mac the product is daemon + orb-host only (no Swift).
#
# Each arch builds NATIVELY on its own hosted runner so ALSA/GTK/WebKit dev
# libraries come from apt (no cross-compile sysroot needed). The B1 integrity
# gate is extended here: the bundled llama-server is verified by size+sha256
# against models.lock, and the .deb's detached GPG signature is verified.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (defaults to VERSION file)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  preflight:
    name: Pre-flight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Resolve release version
        id: version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            INPUT_VERSION="${{ github.event.inputs.version }}"
            echo "version=${INPUT_VERSION:-$FILE_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            runtime_platform: linux-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            runtime_platform: linux-aarch64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          lfs: true

      - name: Install build + packaging dependencies
        run: |
          # arm64 runners intermittently lack IPv6 routes to ports.ubuntu.com; force IPv4 + retries.
          echo 'Acquire::ForceIPv4 "true"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-fae-ci-ipv4 >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxdo-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxkbcommon-dev libwayland-dev \
            dpkg-dev fakeroot file desktop-file-utils

      - name: Install AppImage tooling
        run: |
          set -euo pipefail
          # appimagetool is fetched, chmod +x'd and executed inside the signing
          # step below whose env holds GPG_PRIVATE_KEY / GPG_PASSPHRASE. Fetching
          # from the MUTABLE 'continuous' tag with no checksum would let a
          # re-uploaded asset run attacker code with the release signing key in
          # scope. Pin to a FIXED tagged release and SHA-256-verify before exec,
          # mirroring scripts/install-llamacpp-runtime.py's fail-closed gate.
          #
          # Pinned release tag for appimagetool (immutable, NOT 'continuous').
          AI_TAG="1.9.0"
          case "${{ matrix.arch }}" in
            # SHA-256 digests of the 1.9.0 release assets, computed 2026-07-02
            # from the canonical GitHub release download URLs. If AI_TAG is ever
            # bumped, recompute both digests the same way:
            #   curl -fsSL -o at.AppImage \
            #     https://github.com/AppImage/appimagetool/releases/download/<tag>/appimagetool-<arch>.AppImage
            #   sha256sum at.AppImage
            amd64) AI_ARCH=x86_64 ; AI_SHA256="46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1" ;;
            arm64) AI_ARCH=aarch64 ; AI_SHA256="04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96" ;;
          esac
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${AI_TAG}/appimagetool-${AI_ARCH}.AppImage"
          # Fail-closed SHA-256 verification BEFORE chmod +x / exec.
          ACTUAL_SHA256="$(sha256sum /tmp/appimagetool | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$AI_SHA256" ]; then
            echo "::error::appimagetool ${AI_ARCH} sha256 mismatch: expected ${AI_SHA256}, got ${ACTUAL_SHA256} — refusing to execute an unverified binary with the release signing key in scope"
            exit 1
          fi
          echo "appimagetool ${AI_ARCH} sha256 verified: ${ACTUAL_SHA256}"
          chmod +x /tmp/appimagetool
          # appimagetool is itself an AppImage; extract it so it runs without FUSE.
          ( cd /tmp && ./appimagetool --appimage-extract >/dev/null )
          sudo ln -sf /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.triple }}

      - name: Crate gate (fmt, clippy -D warnings, tests)
        working-directory: crates
        run: |
          set -euo pipefail
          env -u RUSTFLAGS cargo fmt -p fae-daemon -- --check
          env -u RUSTFLAGS cargo clippy -p fae-daemon --bin fae-daemon --all-features \
            -- -D warnings -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used
          env -u RUSTFLAGS cargo nextest run -p fae-daemon || env -u RUSTFLAGS cargo test -p fae-daemon

      - name: Build fae-daemon (release, native)
        working-directory: crates
        run: env -u RUSTFLAGS cargo build --locked --release -p fae-daemon --all-features

      - name: Build fae-ui-shell (release, native)
        working-directory: native/rust/fae-ui-shell
        run: env -u RUSTFLAGS cargo build --locked --release

      - name: Verify binary architecture (honest arch gate)
        run: |
          set -euo pipefail
          # Prove the built binaries' ELF machine type matches the advertised
          # arch before anything is packaged or signed. A wrong-target cross
          # artifact or a stale build from another arch is caught here. The
          # packaging script re-checks this internally too; failing here keeps
          # the signal sharp before the runtime download.
          python3 scripts/build-linux-package.py \
            --verify-arch-only --arch ${{ matrix.arch }} \
            --daemon crates/target/release/fae-daemon \
            --ui-shell native/rust/fae-ui-shell/target/release/fae-ui-shell
          echo "── file(1) confirmation ──"
          file crates/target/release/fae-daemon
          file native/rust/fae-ui-shell/target/release/fae-ui-shell

      - name: Install + SHA-verify llama.cpp runtime
        run: |
          python3 scripts/install-llamacpp-runtime.py \
            --platform ${{ matrix.runtime_platform }} \
            --install-dir build/linux/LlamaCpp-${{ matrix.arch }} --force

      - name: Build packages (.deb + AppImage)
        env:
          GPG_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GPG_PRIVATE_KEY || '' }}
          GPG_PASSPHRASE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GPG_PASSPHRASE || '' }}
        run: |
          set -euo pipefail
          GPG_ARG=()
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
              echo "::error::GPG_PRIVATE_KEY and GPG_PASSPHRASE are required to sign Linux release packages for tag pushes"
              exit 1
            fi
            export GNUPGHOME="$(mktemp -d)"
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
            echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
            gpgconf --kill gpg-agent || true
            GPG_ARG=(--gpg-key "$FPR")
            echo "Signing tag release with imported key $FPR"
          else
            echo "::warning::workflow_dispatch is an unsigned dry-run; organization signing secrets are not exposed"
          fi
          DAEMON="crates/target/release/fae-daemon"
          UISHELL="native/rust/fae-ui-shell/target/release/fae-ui-shell"
          python3 scripts/build-linux-package.py \
            --arch ${{ matrix.arch }} --version "${VERSION}" \
            --daemon "$DAEMON" --ui-shell "$UISHELL" \
            --out-dir build/linux/dist "${GPG_ARG[@]}"

      - name: Integrity gate (runtime SHA vs lock + GPG verify)
        env:
          GPG_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GPG_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          RUNTIME="build/linux/LlamaCpp-${{ matrix.arch }}/llama-server"
          test -x "$RUNTIME"
          # Re-verify the runtime binary size+sha256 against the runtime lock
          # (the B1 gate, extended to Linux). Fail the job on any mismatch.
          python3 - "$RUNTIME" "${{ matrix.runtime_platform }}" <<'PY'
          import hashlib, json, os, sys, pathlib
          binp, plat = sys.argv[1], sys.argv[2]
          lock = json.loads(pathlib.Path("scripts/llamacpp-runtime.lock.json").read_text())
          rt = lock["runtimes"][plat]
          size = os.path.getsize(binp)
          assert size == rt["binary_size_bytes"], f"size {size} != {rt['binary_size_bytes']}"
          h = hashlib.sha256(pathlib.Path(binp).read_bytes()).hexdigest()
          assert h == rt["binary_sha256"], f"sha {h} != {rt['binary_sha256']}"
          print(f"runtime integrity OK: {plat} {size} bytes sha256={h}")
          PY
          DEB=$(ls build/linux/dist/fae_*_${{ matrix.arch }}.deb)
          echo "Built: $DEB"
          # The .deb must be a real Debian archive.
          ar t "$DEB" | tr '\n' ' '; echo
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            export GNUPGHOME="$(mktemp -d)"
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --verify "$DEB.asc" "$DEB"
            echo "GPG signature verified"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::GPG_PRIVATE_KEY is required to verify Linux release packages for tag pushes"
            exit 1
          else
            echo "::warning::Unsigned build — skipping GPG verify (workflow_dispatch dry-run only)"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fae-linux-${{ matrix.arch }}
          path: |
            build/linux/dist/fae_*_${{ matrix.arch }}.deb
            build/linux/dist/fae_*_${{ matrix.arch }}.deb.asc
            build/linux/dist/Fae-*-*.AppImage
          if-no-files-found: error

  # ── Attach Linux artifacts to the GitHub Release for the tag ──────
  # Only runs on v* tag pushes. release.yml creates the release for the same
  # tag; softprops/action-gh-release attaches to that same release (matched by
  # the triggering tag ref), so macOS and Linux artifacts land together.
  publish:
    name: Publish Linux artifacts
    needs: build-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fae-linux-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate Linux checksums
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f ! -name 'SHA256SUMS-linux.txt' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Sign Linux checksums with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ] || [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY and GPG_PASSPHRASE are required to sign Linux release checksums for tag pushes"
            exit 1
          fi
          cd artifacts
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$FPR" --armor --detach-sign \
            --output SHA256SUMS-linux.txt.asc SHA256SUMS-linux.txt
          gpg --batch --verify SHA256SUMS-linux.txt.asc SHA256SUMS-linux.txt
          echo "Signed SHA256SUMS-linux.txt with key $FPR"

      - name: Attach Linux artifacts to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/fae_*_amd64.deb
            artifacts/fae_*_arm64.deb
            artifacts/fae_*_amd64.deb.asc
            artifacts/fae_*_arm64.deb.asc
            artifacts/Fae-*-*.AppImage
            artifacts/SHA256SUMS-linux.txt
            artifacts/SHA256SUMS-linux.txt.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
