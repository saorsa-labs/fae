# Fae headless-core — production Rust workspace (Phase 1).
# Greenfield daemon shell + selective ports (per docs/architecture/legacy-reuse-audit.md).
# Control-plane-first: the authorization core lands and is fully tested BEFORE any
# network surface exists, so a half-secure server cannot be created by accident.
[workspace]
resolver = "2"
members = [
  "fae-control-plane",
  "fae-envelope-gate",
  "fae-pii-membrane",
  "fae-metaopt",
  "fae-engine",
  "fae-audio",
  "fae-acp",
  "fae-daemon",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/saorsa-labs/fae"
authors = ["Saorsa Labs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["serde"] }
getrandom = { version = "0.2", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
toml = "0.8"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
# HTTP/SSE client for the llama-server sidecar (gap B1). Loopback-only, so no
# TLS backend is pulled in (default-features off); `stream` gives the SSE
# byte-stream, `json` the request body helper.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
# Native ACP (Agent Client Protocol) client — Zed's canonical Rust toolkit:
# protocol types + JSON-RPC framing + Client/Agent traits. fae-acp builds on
# these instead of hand-rolling the wire format.
agent-client-protocol = "0.14"
agent-client-protocol-tokio = "0.11"

[profile.release]
opt-level = 3

# ---------------------------------------------------------------------------
# Vendored mistral.rs + candle (Gemma-4 Metal NaN-logits fix — branch
# daemon-metal-fix). The upstream git deps are redirected to in-repo committed
# source under ../vendor so the candle Metal softmax kernel is editable AND is
# the code our build actually executes.
#
# Provenance (copied from the exact cargo-pinned checkouts, .git stripped):
#   vendor/mistral.rs  = EricLBuehler/mistral.rs @ c22c2e2b622a815821e59056c2b5952b4cbbe010
#   vendor/candle      = huggingface/candle      @ d2afd7f7f746ac72236f81736135de1fcd543426
#
# `[patch]` keys are the original source URLs (rev-agnostic), so every rev of
# these URLs resolves to the local path. Un-vendor by deleting these two blocks
# once the candle kernel fix lands upstream.
# ---------------------------------------------------------------------------
[patch."https://github.com/huggingface/candle.git"]
candle-core = { path = "../vendor/candle/candle-core" }
candle-metal-kernels = { path = "../vendor/candle/candle-metal-kernels" }
candle-nn = { path = "../vendor/candle/candle-nn" }
candle-ug = { path = "../vendor/candle/candle-ug" }

[patch."https://github.com/EricLBuehler/mistral.rs"]
mistralrs = { path = "../vendor/mistral.rs/mistralrs" }
mistralrs-audio = { path = "../vendor/mistral.rs/mistralrs-audio" }
mistralrs-core = { path = "../vendor/mistral.rs/mistralrs-core" }
mistralrs-macros = { path = "../vendor/mistral.rs/mistralrs-macros" }
mistralrs-mcp = { path = "../vendor/mistral.rs/mistralrs-mcp" }
mistralrs-paged-attn = { path = "../vendor/mistral.rs/mistralrs-paged-attn" }
mistralrs-quant = { path = "../vendor/mistral.rs/mistralrs-quant" }
mistralrs-sandbox = { path = "../vendor/mistral.rs/mistralrs-sandbox" }
mistralrs-vision = { path = "../vendor/mistral.rs/mistralrs-vision" }
