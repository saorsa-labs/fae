# Fae headless-core — production Rust workspace (Phase 1).
# Greenfield daemon shell + selective ports (per docs/architecture/legacy-reuse-audit.md).
# Control-plane-first: the authorization core lands and is fully tested BEFORE any
# network surface exists, so a half-secure server cannot be created by accident.
[workspace]
resolver = "2"
members = [
  "fae-control-plane",
  "fae-envelope-gate",
  "fae-engine",
  "fae-daemon",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/saorsa-labs/fae"
authors = ["Saorsa Labs"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = { version = "0.2", features = ["std"] }
sha2 = "0.10"
subtle = "2"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
toml = "0.8"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"

[profile.release]
opt-level = 3
