# gemm-common's aarch64 SIMD path emits FEAT_FP16 ("fullfp16") inline assembly
# that the baseline `aarch64-unknown-linux-gnu` target does not enable, which
# breaks the Linux arm64 build of the vendored candle/mistral.rs matmul stack.
# That stack is dead weight on Linux (the daemon engine is the llama.cpp sidecar;
# `FAE_ENGINE=mistralrs` hard-errors) but must still compile. FEAT_FP16 is present
# on every modern arm64 (Graviton / Ampere / Neoverse / Apple), so enabling it
# unblocks the build without affecting the runtime (which never runs the gemm
# path). Target-scoped: macOS and linux-x86_64 are unaffected. Applies when
# RUSTFLAGS is unset — the repo's `env -u RUSTFLAGS` build convention.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]
