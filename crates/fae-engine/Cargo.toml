[package]
name = "fae-engine"
version = "0.1.0"
description = "Local inference provider abstraction (ProviderAdapter) + fail-closed models.lock checksum loader. The mistral.rs adapter lands in chunk 3b."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }

# mistral.rs is a hard dependency (owner decision — not feature-gated). Accel is
# target-conditional: Metal on Apple Silicon, plain candle (CPU/CUDA) elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { version = "0.8", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mistralrs = { version = "0.8" }

[dev-dependencies]
tokio = { workspace = true }
