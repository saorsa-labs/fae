[package]
name = "fae-engine"
version = "0.1.0"
description = "Local inference provider abstraction (ProviderAdapter) + fail-closed models.lock checksum loader. The mistral.rs adapter lands in chunk 3b."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
# Daemon-side TTS (S19). voice-g2p (text → phonemes) is pure Rust and
# portable; tokio is needed for the oneshot reply channel.
voice-g2p = "=0.2.1"
tokio = { workspace = true }
# Parakeet ASR (ADR: scout-adr.md). NVIDIA parakeet-tdt-0.6b-v2 Int8 ONNX via
# the sherpa-onnx Rust bindings (Apache-2.0). Turnkey static linking: the build
# script auto-downloads prebuilt onnxruntime + C++ core archives for macOS
# arm64/x86_64 and Linux x86_64/aarch64, so `sherpa-onnx = "1.13.4"` just works
# with no SHERPA_ONNX_LIB_DIR. The pinned crate version is the runtime-integrity
# boundary for the *native* libs; `models.lock` covers the MODEL artifacts. On
# Apple Silicon, onnxruntime's CoreML EP falls back to CPU for Parakeet's
# FastConformer-transducer ops (sherpa-onnx #152) — Parakeet runs CPU-bound,
# which is acceptable for short-utterance fallback ASR.
sherpa-onnx = { version = "1.13.4", optional = true }

[features]
# Parakeet ASR (sherpa-onnx) is a DEFAULT-ON cargo feature: the daemon ships with
# local ASR by default, but can be built WITHOUT it (`--no-default-features`) for
# targets where sherpa-onnx's prebuilt C++ static lib can't link — notably the
# cargo-zigbuild packaging-proof, whose hermetic zig sysroot lacks GNU libstdc++
# (glibc/libc++ mismatch). Native ci-linux (both arches) + macOS build with it ON.
# `Loader::SherpaOnnx` stays in the models.lock enum regardless so the lock still
# parses when the feature is off (the entries are just unused).
default = ["parakeet"]
parakeet = ["dep:sherpa-onnx"]

# mistral.rs is a hard dependency (owner decision — not feature-gated). Accel is
# target-conditional: Metal on Apple Silicon, plain candle (CPU/CUDA) elsewhere.
# Pinned past v0.8.3 to master c22c2e2b (2026-06-11): picks up the Metal sdpa
# offset fix (e5b9b93d) and SWA prefill corner-chunking fix (d6e94699) — cures
# the deterministic "invalid Metal top-k softmax normalizer" inference failure
# on Gemma 4 turns whose prompt length lands in a bad prefill-chunk window
# (diagnosed 2026-06-12; replayable payloads in that day's session notes).
# Bumping past this is NOT a NaN cure: master ab001013 (2026-06-15) was tested
# against the deterministic repro (examples/nan_repro.rs, issue #2214) and still
# FAILS on both Q4K and Q8_0 — #2214 is open with no upstream fix, candle stays
# pinned at d2afd7f, and the only post-c22c2e2b Gemma-4 change (#2227) is an
# unrelated KV-sharing prefill optimisation. Do not bump for the NaN.
# Git deps use commit SHAs per the supply-chain pinning policy.
[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "c22c2e2b622a815821e59056c2b5952b4cbbe010", features = ["metal"] }
# Kokoro TTS on mlx-rs (Apple Silicon). Exact-pinned per supply-chain policy;
# the candle port replaces this for non-Apple targets (MockTtsAdapter there).
voice-tts = "=0.2.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "c22c2e2b622a815821e59056c2b5952b4cbbe010" }

[dev-dependencies]
tokio = { workspace = true }
