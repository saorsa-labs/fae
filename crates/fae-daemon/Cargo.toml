[package]
name = "fae-daemon"
version = "0.1.0"
description = "Fae headless-core daemon — Phase 1 skeleton: control-plane bootstrap (run dir 0700, token 0600) + authorization wiring. Network listener (Unix socket/WS) and the mistral.rs engine adapter land in subsequent chunks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fae-daemon"
path = "src/main.rs"

[dependencies]
fae-audio = { path = "../fae-audio" }
fae-control-plane = { path = "../fae-control-plane" }
fae-envelope-gate = { path = "../fae-envelope-gate" }
fae-engine = { path = "../fae-engine" }
fae-acp = { path = "../fae-acp" }
fae-pii-membrane = { path = "../fae-pii-membrane" }
# M3-C2: fae-metaopt reaches the daemon ONLY via conductor/recipe_mutation.rs
# (the recipe validator) + the future CLI. The CI boundary guard
# (scripts/ci/guard-metaopt-boundary.sh) keeps it out of the live turn loop.
fae-metaopt = { path = "../fae-metaopt" }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
async-trait.workspace = true
base64 = { workspace = true }
# NFKC normalization for the M3 prompt-mutation lint (§5.1 canonicalization).
unicode-normalization = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
