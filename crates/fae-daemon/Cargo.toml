[package]
name = "fae-daemon"
version = "0.1.0"
description = "Fae headless-core daemon — Phase 1 skeleton: control-plane bootstrap (run dir 0700, token 0600) + authorization wiring. Network listener (Unix socket/WS) and the mistral.rs engine adapter land in subsequent chunks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fae-daemon"
path = "src/main.rs"

# Phase G3: a minimal in-repo MCP server (newline-delimited JSON-RPC over stdio)
# used only as the integration-test fixture for the real spawn->list->invoke
# round trip. Tiny; no model, no network.
[[bin]]
name = "mock_mcp_server"
path = "src/bin/mock_mcp_server.rs"

[features]
# Parakeet ASR is a default-on feature (forwards to fae-engine's `parakeet`).
# Build WITHOUT it (`--no-default-features`) for the cargo-zigbuild packaging
# lane, whose hermetic zig sysroot can't link sherpa-onnx's GNU-libstdc++ static
# lib. When the feature is OFF and a caller requests parakeet, the daemon prints
# a LOUD "not compiled into this build" message and falls back to Gemma.
default = ["parakeet"]
parakeet = ["fae-engine/parakeet"]

[dependencies]
fae-audio = { path = "../fae-audio" }
fae-control-plane = { path = "../fae-control-plane" }
fae-envelope-gate = { path = "../fae-envelope-gate" }
fae-engine = { path = "../fae-engine", default-features = false }
fae-acp = { path = "../fae-acp" }
fae-pii-membrane = { path = "../fae-pii-membrane" }
# ADR-013 Vision A (A1): fluers as the daemon tool/skill execution substrate.
# Git-dep (pinned to v0.2.0 in [workspace.dependencies]) — NOT a path-dep, so CI
# needs no sibling checkout. A2 builds the governed ToolHost on top; today this
# only proves the dep resolves + the A2 foundation types are reachable.
fluers-core = { workspace = true }
fluers-runtime = { workspace = true }
# M3-C2: fae-metaopt reaches the daemon ONLY via conductor/recipe_mutation.rs
# (the recipe validator) + the future CLI. The CI boundary guard
# (scripts/ci/guard-metaopt-boundary.sh) keeps it out of the live turn loop.
fae-metaopt = { path = "../fae-metaopt" }
serde = { workspace = true }
serde_json.workspace = true
reqwest = { workspace = true }
thiserror.workspace = true
getrandom.workspace = true
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
# Phase E: the x0x `/direct/events` SSE stream is assembled with `stream!`.
async-stream = { workspace = true }
async-trait.workspace = true
base64 = { workspace = true }
# NFKC normalization for the M3 prompt-mutation lint (§5.1 canonicalization).
unicode-normalization = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Phase E peer signing: local ML-DSA-65 verification of inbound peer-envelope
# signatures (org PQC crate; the SAME crate x0xd signs with via ant-quic, so a
# daemon-side verify is bit-compatible with an x0xd-side sign by construction).
# Signing itself stays in x0xd (`POST /agent/sign`) — the daemon never holds
# key material; this dependency is verification-only public-key crypto (tests
# also use its keygen to build real signed fixtures).
saorsa-pqc = "0.5"
# A3: per-session ephemeral tool sandbox root (tempfile::TempDir guard).
tempfile = "3"
dirs = "2"
# Phase G3: external MCP tool tier. `mistralrs-mcp` is ALREADY in the build graph
# (mistralrs-core depends on it, patched to ../vendor), so this direct edge adds
# ZERO new compilation — we consume only its low-level ProcessMcpConnection (stdio)
# + list_tools/call_tool primitives, NOT its automatic tool-call loop. No cargo
# feature gate: the dep is unconditionally compiled anyway, so the real gate is
# runtime config presence (`FAE_MCP_CONFIG`). Declared via the same git URL +
# rev as fae-engine's `mistralrs` (the workspace `[patch]` redirects the URL to
# ../vendor/mistral.rs/*), so this resolves to the SAME already-built crate
# instance as the transitive mistralrs-core -> mistralrs-mcp edge. `toml` parses
# the declaration file.
mistralrs-mcp = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "c22c2e2b622a815821e59056c2b5952b4cbbe010" }
toml = { workspace = true }

# B2: OS-level execution isolation. macOS uses `/usr/bin/sandbox-exec` (no
# crate); Linux uses Landlock (pure syscalls, no daemon/root) applied in a
# pre_exec hook so only the tool's child process is confined.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"

[dev-dependencies]
# Phase E peer tests: AcceptAllSignatureVerifier (test-util, test-only) mints
# AcceptedEnvelopes for kinds the production FaeSenderVerifier refuses, so
# handler dispatch guards can be probed independently of the verifier matrix.
fae-envelope-gate = { path = "../fae-envelope-gate", features = ["test-util"] }
# Phase G3: the MCP catalog tests implement the vendored `McpServerConnection`
# trait (which returns `anyhow::Result`) with a mock; the stdio integration test
# spawns the mock server via the vendored ProcessMcpConnection (already a normal
# dependency above, so no separate dev entry for it is needed).
anyhow = "1"
