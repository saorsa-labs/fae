[package]
name = "fae-symphony-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Standalone x0x-symphony Runner: claims a TaskItem from x0xd (trust-gated, ML-DSA-signed) and executes it by driving fae-daemon's conversation.delegate over its Unix socket, then publishes a signed handoff + proofs. Phase F3."

[[bin]]
name = "fae-symphony-runner"
path = "src/main.rs"

[lib]
name = "fae_symphony_runner"
path = "src/lib.rs"

[dependencies]
# ── Fae workspace: the daemon WIRE CONTRACT only ─────────────────────────────
# fae-control-plane carries the Command/Response NDJSON envelope the daemon
# speaks. We deliberately do NOT depend on `fae-daemon` — the runner is a pure
# socket client of the daemon's EXISTING protocol (conversation.delegate as
# landed in Phase F1). This keeps `cargo tree -i x0x-symphony-core` clean:
# fae-daemon never pulls a symphony crate, the quarantine lives here.
fae-control-plane = { path = "../fae-control-plane" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `signal` (on top of the workspace features) backs graceful Ctrl-C shutdown.
tokio = { workspace = true, features = ["signal"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ── x0x-symphony: crates.io 0.1.0 pins (published 2026-07-04) ───────────────
# Local dev override: swap each `version = "0.1.0"` for the sibling path dep
# `{ path = "../../../x0x-symphony/crates/<name>" }` when editing symphony in-tree.
x0x-symphony-core             = "0.1.0"
x0x-symphony-orchestrator     = "0.1.0"
x0x-symphony-tracker-x0x-crdt = "0.1.0"
x0x-symphony-signing          = "0.1.0"
x0x-symphony-workspace        = "0.1.0"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["clock"] }
