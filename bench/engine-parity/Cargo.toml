[package]
name = "engine-parity"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mistralrs = { version = "0.8", features = ["metal"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
